services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omh
      POSTGRES_USER: omh
      POSTGRES_PASSWORD: omh
    ports:
      - "5432:5432"
    volumes:
      - omh-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omh -d omh"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      OMH_DATABASE_URL: postgresql+asyncpg://omh:omh@postgres:5432/omh
    command: sh -c "pip install -e . && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    working_dir: /app
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  omh-postgres:
