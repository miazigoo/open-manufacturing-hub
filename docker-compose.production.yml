services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omh}
      POSTGRES_USER: ${POSTGRES_USER:-omh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - omh-postgres-production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-omh} -d $${POSTGRES_DB:-omh}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migration:
    build: ./backend
    image: open-manufacturing-hub-backend:production
    restart: "no"
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      OMH_APP_ENV: production
      OMH_PRODUCTION_PROFILE: "true"
      OMH_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      OMH_SECRET_KEY: ${OMH_SECRET_KEY:?Set OMH_SECRET_KEY in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "i=0;
      until alembic upgrade head; do
        i=$$((i+1));
        if [ $$i -ge 30 ]; then exit 1; fi;
        echo 'Waiting for database DNS/connection...';
        sleep 2;
      done"

  backend:
    build: ./backend
    image: open-manufacturing-hub-backend:production
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      OMH_APP_ENV: production
      OMH_PRODUCTION_PROFILE: "true"
      OMH_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      OMH_SECRET_KEY: ${OMH_SECRET_KEY:?Set OMH_SECRET_KEY in .env.production}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-${PUBLIC_BASE_URL:-http://localhost:8000}}
      OMH_ALLOW_DEMO_SEED_IN_PRODUCTION: "false"
      OMH_REQUIRE_WORKER_HEARTBEAT: ${OMH_REQUIRE_WORKER_HEARTBEAT:-false}
      OMH_MARKING_CODE_POOL_EXPORT_DIR: ${OMH_MARKING_CODE_POOL_EXPORT_DIR:-/app/exports/marking-code-pools}
    volumes:
      - ./backups:/app/backups
      - ./backend/exports:/app/exports
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)\""]
      interval: 20s
      timeout: 8s
      retries: 10
      start_period: 30s

  worker:
    build: ./backend
    image: open-manufacturing-hub-backend:production
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      OMH_APP_ENV: production
      OMH_PRODUCTION_PROFILE: "true"
      OMH_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      OMH_SECRET_KEY: ${OMH_SECRET_KEY:?Set OMH_SECRET_KEY in .env.production}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-${PUBLIC_BASE_URL:-http://localhost:8000}}
      OMH_ALLOW_DEMO_SEED_IN_PRODUCTION: "false"
      OMH_MARKING_CODE_POOL_EXPORT_DIR: ${OMH_MARKING_CODE_POOL_EXPORT_DIR:-/app/exports/marking-code-pools}
    volumes:
      - ./backups:/app/backups
      - ./backend/exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    command: python -m app.workers.queue_worker
    healthcheck:
      test: ["CMD-SHELL", "python -m app.workers.queue_worker --healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      target: production
    image: open-manufacturing-hub-frontend:production
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/omh.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health/live >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    env_file:
      - .env.production
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "mkdir -p /backups/db &&
      pg_dump -h postgres -U $${POSTGRES_USER:-omh} $${POSTGRES_DB:-omh}
      > /backups/db/omh-db-$$(date +%Y%m%d-%H%M%S).sql"

  restore-db:
    image: postgres:16-alpine
    profiles: ["restore"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    networks: [recovery]
    volumes: [omh-recovery:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omh}"]
      interval: 2s
      timeout: 5s
      retries: 30

  restore-client:
    profiles: ["restore"]
    image: open-manufacturing-hub-backend:production
    build: ./backend
    networks: [recovery]
    environment:
      POSTGRES_HOST: restore-db
      POSTGRES_USER: ${POSTGRES_USER:-omh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    entrypoint: ["python", "scripts/restore_drill.py"]

networks:
  recovery:
    internal: true

volumes:
  omh-recovery:
  omh-postgres-production:
