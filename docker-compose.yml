services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omh
      POSTGRES_USER: omh
      POSTGRES_PASSWORD: omh
    volumes:
      - omh-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omh -d omh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      OMH_DATABASE_URL: postgresql+asyncpg://omh:omh@postgres:5432/omh
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    command: >
      sh -c "pip install -e . &&
      i=0;
      until alembic upgrade head; do
        i=$$((i+1));
        if [ $$i -ge 30 ]; then exit 1; fi;
        echo 'Waiting for database DNS/connection...';
        sleep 2;
      done;
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  omh-postgres:
